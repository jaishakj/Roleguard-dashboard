<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
    <script>
      (function() {
        try {
          const fixFetch = (target) => {
            if (!target) return;
            try {
              const descriptor = Object.getOwnPropertyDescriptor(target, 'fetch');
              if (descriptor && (!descriptor.writable || !descriptor.set)) {
                let currentValue = descriptor.value;
                const originalGet = descriptor.get;
                
                Object.defineProperty(target, 'fetch', {
                  get: function() { 
                    if (originalGet) return originalGet.call(target);
                    return currentValue;
                  },
                  set: function(v) { 
                    console.log('Suppressed fetch overwrite, caching value');
                    currentValue = v;
                  },
                  configurable: true,
                  enumerable: true
                });
              }
            } catch (e) {}
          };
          const targets = [];
          if (typeof window !== 'undefined') targets.push(window);
          if (typeof self !== 'undefined') targets.push(self);
          if (typeof globalThis !== 'undefined') targets.push(globalThis);
          targets.forEach(fixFetch);
          if (typeof window !== 'undefined' && !window.global) {
            window.global = window;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
